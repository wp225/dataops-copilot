
[project]
name = "dataops_copilot"
version = "1.3.2"
description = "DataOps Copilot: an agentic data-quality and incident-response system for an Azure data lake."
authors = [{ name = "Jeorge Joshi", email = "georgejoshi10@gmail.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["python"]
requires-python = ">=3.13,<4"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.141.1",
    "pandas>=2.2,<3",
    "pydantic-settings>=2.15.0",
    "pyspark[sql]>=4.2,<4.3",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.3",
    "pydantic>=2.12,<3",
    "langchain>=1.3.10",
    "langchain-anthropic>=1.4.6",
    "langchain-model-profiles>=0.0.4",
    "mcp>=1.21.1",
    "langchain-mcp-adapters>=0.1.13",
    "langgraph>=1.0.3",
    "langgraph-cli>=0.4.9",
    "langsmith>=0.8.18",
    "langchain-core>=1.3.3"
]

[dependency-groups]
dev = [
    "ty>=0.0.65",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "pytest-randomly>=4.1.0",
    "hypothesis>=6.164.0",
    "coverage>=7.15.2",
    "ruff>=0.16.1",
    "taskipy>=1.14.1",
    "pre-commit>=4.6.1",
    "python-semantic-release>=10.6.1",
    "httpx2>=2.10.0",
    "zensical>=0.0.52",
    "ipykernel>=6.0",
    "pydantic>=2.12,<3",

]

[project.urls]
homepage = "https://github.com/wp225/dataops-copilot"
repository = "https://github.com/wp225/dataops-copilot.git"
documentation = "https://github.com/wp225/dataops-copilot"
issues = "https://github.com/wp225/dataops-copilot/issues"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.taskipy.tasks]
format = { cmd = "ruff format ./src/", help = "Format code using ruff" }
lint = { cmd = "ruff check --fix ./src/", help = "Lint code using ruff" }
type = { cmd = "ty check", help = "Typecheck code using ty" }
release = { cmd = "uv run python-semantic-release version", help = "Create a release (version bump + changelog + tag)" }
tests = { cmd = "pytest --verbose --color=yes tests", help = "Run all tests using pytest" }
coverage = { cmd = "coverage run -m pytest tests && coverage report", help = "Generate coverage report" }
run = { cmd = "uv run ./src/dataops_copilot/dataops_copilot.py", help = "Run main application" }
upgrade = { cmd = "uv sync --upgrade", help = "Upgrade all dependencies to latest versions."}

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
    "*.egg-info",
    "htmlcov",
    ".cache",
]
src = ["src", "tests"]

[tool.ruff.lint]
pydocstyle.convention = "google"
fixable = ["ALL"]
select = ["ALL"]
ignore = [
    "FA102",    # Flake8-future-annotations
    "F401",     # Disable fix for unused imports
    "B904",     # Allow raising exceptions without from e
    "PLR0913",  # too many arguments
    "CPY",      # Flake8-copyright
    "T201",     # Debugging print statements
    "ERA",      # Eradicate – detects commented-out code
    "BLE001",   # Catch-all exceptions
    "D100",     # missing docstring in public module
    "D105",     # undocumented magic method
    "D107",     # undocumented public init
    "D203",     # incorrect-blank-line-before-class
    "D205",     # line-between-summary-and-description
    "D212",     # multi-line-summary-first-line
    "D400",     # missing-trailing-period
    "D407",     # missing-dashed-underline-after-section
    "S311",     # rand-usage
    "EM102",    # f-string-exception
    "TRY003",   # long-exception-messages
    "COM812",
    "N812",  # PySpark convention: import functions as F
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "PLC0415",  # Import outside top-level (tests often need scoped imports)
    "PLR2004",  # Magic values
    "F841",     # Unused variable (fixtures, etc.)
    "PT001",    # Use @pytest.fixture() over @pytest.fixture
    "S101",     # Use of assert detected
    "D101",     # Missing docstring in public class
    "D103",     # Missing docstring in public function
    "E741",     # Ambiguous variable name 'l', 'O', or 'I'
]


[tool.ty]
terminal.output-format = "full"

[tool.ty.environment]
python = ".venv"

[tool.ty.src]
include = ["src/**/*.py"]

[tool.coverage.report]
skip_empty = true
show_missing = true
fail_under = 85
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["_*.py", "__*.py"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 60

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_author = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
commit_parser = "angular"
tag_format = "v{version}"
branch = "main"
