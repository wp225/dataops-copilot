site_name: DataOps Copilot
site_url: https://wp225.github.io/dataops-copilot/
site_description: >-
  Agentic data-quality and root-cause analysis for an Azure data lake. Spark
  profiles each batch, Claude plans and judges, and a read-only check catalog
  gathers the evidence.
site_author: Jeorge Joshi
repo_url: https://github.com/wp225/dataops-copilot
repo_name: wp225/dataops-copilot
edit_uri: edit/main/docs/
copyright: Maintained by <a href="https://github.com/wp225">Jeorge Joshi</a>. MIT licensed.

nav:
  - Home: index.md
  - Demo walkthrough: demo.md
  - Getting started: getting-started.md
  - Concepts:
      - Architecture: architecture.md
      - Check catalog: checks.md
      - Planner evaluation: evaluation.md
  - Reference:
      - HTTP API and CLI: api.md
      - Configuration: configuration.md
  - Operations:
      - Deploy to Azure: deployment.md
      - Development: development.md
  - License: license.md

theme:
  name: material
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  icon:
    logo: material/database-search
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
